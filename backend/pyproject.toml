[project]
name = "life-brain-backend"
version = "0.1.0"
description = "Life Brain API: personal second brain"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "openai>=3.26.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real LLM API (needs LLM_API_KEY); run with `pytest -m live`"]
