name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, even when nobody touches the code: dependencies go stale on their own
  # (Next 16.4.0 picked up two RCE advisories while this repo sat untouched).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/life_brain_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only (no floating v10 tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (exactly the locked versions)
        run: uv sync --locked
      - name: Tests (LLMs mocked; no API keys, nothing is spent)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Colour contrast (WCAG AA, light and dark)
        run: npm run check:contrast
      - run: npm run build
      - name: Audit shipped dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
